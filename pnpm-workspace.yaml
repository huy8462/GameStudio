# DDD-00 §4.1 (MOD-GEN-10…21), ADR-016. games/* không phải gói pnpm (dữ liệu, không có package.json).
packages:
  - 'engine/*'
  - 'engine/shared/*'
  - 'engine/build/*'
  # Bước build viết bằng TS (bước node, IF-CLI-02): mỗi bước một gói có package.json (T-0010).
  - 'engine/build/steps/*'
  - 'web/*'
  - 'prototypes/*'
minimumReleaseAgeExclude:
  - dependency-cruiser@18.9.0
